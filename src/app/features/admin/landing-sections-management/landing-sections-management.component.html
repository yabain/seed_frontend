<div class="admin-page">
  <header class="page-head">
    <h1><i class="ti ti-layout-grid"></i> Sections de la landing</h1>
    <p class="text-muted">Modifiez les titres, sous-titres et descriptions affichés sur la page d’accueil. Les contenus de chaque liste se gèrent dans leurs rubriques respectives.</p>
  </header>

  <section class="card mt-2" *ngIf="loaded(); else loading">
    <ng-container *ngFor="let section of [{ key: 'events', label: 'Événements', value: sections.events }, { key: 'news', label: 'Actualités', value: sections.news }, { key: 'programs', label: 'Programmes', value: sections.programs }, { key: 'partners', label: 'Partenaires', value: sections.partners }]">
      <div class="form-field">
        <h2>{{ section.label }}</h2>
        <label [for]="section.key + '-eyebrow'">Sous-titre / badge</label>
        <input class="form-control" [id]="section.key + '-eyebrow'" [(ngModel)]="section.value.eyebrow" [name]="section.key + '-eyebrow'" maxlength="100" />
        <label [for]="section.key + '-title'">Titre</label>
        <input class="form-control" [id]="section.key + '-title'" [(ngModel)]="section.value.title" [name]="section.key + '-title'" maxlength="200" />
        <label [for]="section.key + '-description'">Paragraphe</label>
        <textarea class="form-control" rows="3" [id]="section.key + '-description'" [(ngModel)]="section.value.description" [name]="section.key + '-description'" maxlength="500"></textarea>
      </div>
    </ng-container>
    <div class="form-actions"><button class="btn btn--primary" (click)="save()" [disabled]="saving()">{{ saving() ? 'Enregistrement…' : 'Enregistrer les textes' }}</button></div>
  </section>

  <ng-template #loading><section class="card mt-2"><span class="skeleton skeleton-text skeleton-text--long"></span></section></ng-template>
</div>
