<div class="admin-page">
  <header class="page-head">
    <h1><i class="ti ti-article"></i> Catégories d’actualités</h1>
    <p class="text-muted">Créez, modifiez ou supprimez les catégories associées aux articles.</p>
  </header>

  <div class="card mt-2">
    <h2>Ajouter une catégorie</h2>
    <div class="category-create">
      <input
        class="form-control"
        type="text"
        [(ngModel)]="newName"
        placeholder="Nom de la catégorie (ex : Éducation)"
        (keyup.enter)="create()"
      />
      <button class="btn btn--primary" (click)="create()" [disabled]="saving()">
        {{ saving() ? 'Ajout…' : 'Ajouter' }}
      </button>
    </div>
  </div>

  <div class="card mt-2 table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Nom</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of items()">
          <ng-container *ngIf="editingId() !== category._id; else editingRow">
            <td class="font-bold">{{ category.name }}</td>
            <td>
              <div class="row-actions">
                <button class="btn btn--sm btn--ghost" (click)="startEdit(category)">Modifier</button>
                <button class="btn btn--sm btn--danger" (click)="remove(category)">Supprimer</button>
              </div>
            </td>
          </ng-container>
          <ng-template #editingRow>
            <td>
              <input
                class="form-control"
                type="text"
                [(ngModel)]="editName"
                (keyup.enter)="saveEdit(category)"
              />
            </td>
            <td>
              <div class="row-actions">
                <button class="btn btn--sm btn--primary" (click)="saveEdit(category)" [disabled]="saving()">
                  Enregistrer
                </button>
                <button class="btn btn--sm btn--ghost" (click)="cancelEdit()">Annuler</button>
              </div>
            </td>
          </ng-template>
        </tr>
        <tr *ngIf="!items().length">
          <td colspan="2"><p class="empty-state">Aucune catégorie pour le moment.</p></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
